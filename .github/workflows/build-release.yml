name: Build Release App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install blueutil
        run: brew install blueutil

      - name: Build packaged app
        run: ./package-release.sh

      - name: Upload packaged app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirPods-Fix-macOS
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.dmg --clobber
          else
            gh release create "$tag" dist/*.dmg --generate-notes
          fi
